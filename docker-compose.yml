services:
  postgres:
    image: "postgres:18"
    # Configura as variáveis de ambiente para o PostgreSQL que sobrescrevem os valores padrão do Dockerfile
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=root
    ports:
      - 5432:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql# Adiciona a verificação de saúde
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d root"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - 8080:8080
    depends_on:
      postgres:
        condition: service_healthy
